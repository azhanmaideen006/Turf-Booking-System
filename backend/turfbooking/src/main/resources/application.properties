
spring.application.name=turfbooking

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/turf_booking_db
spring.datasource.username=your_username_here
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Admin Configuration
app.admin.email=your_admin_email_here
app.admin.password=your_admin_password_here

# Turf Image Upload Directory
turfzone.upload-dir=uploads
